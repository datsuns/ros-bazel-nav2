version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    user: ros
    network_mode: "host"
    ipc: "host"
    pid: "host"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg
      # devcontainerのデフォルトの挙動に合わせて、ワークスペースをマウントします
      - ..:/workspaces/map_server
    working_dir: /workspaces/map_server
    devices:
      - /dev/dxg:/dev/dxg
    environment:
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - PULSE_SERVER=${PULSE_SERVER}
    # devcontainer環境としてコンテナが終了しないようにスリープさせます
    command: sleep infinity
